const loaded=new Set();
let active='plan';
function loadTab(name){if(loaded.has(name))return;document.getElementById('frame-'+name).srcdoc=new TextDecoder().decode(Uint8Array.from(atob(embedded[name]),c=>c.charCodeAt(0)));loaded.add(name);}
function setTab(name,focus=false){
if(!Object.hasOwn(embedded,name))name='plan';
const mock=document.getElementById('frame-mockup');
if(active==='mockup'&&name!=='mockup'&&loaded.has('mockup')){try{mock.contentWindow.eval('flushTimer(); save();');}catch(e){}}
for(const button of document.querySelectorAll('[role="tab"]')){const selected=button.dataset.tab===name;button.setAttribute('aria-selected',String(selected));button.tabIndex=selected?0:-1;document.getElementById('panel-'+button.dataset.tab).hidden=!selected;}
loadTab(name);
if(active!=='mockup'&&name==='mockup'){try{mock.contentWindow.eval('if(readRunning && !document.hidden) tickStart=performance.now();');}catch(e){}}
active=name;
try{history.replaceState(null,'','#'+name);}catch(e){}
if(focus)document.getElementById('tab-'+name).focus();
}
document.querySelectorAll('[role="tab"]').forEach(button=>{
button.addEventListener('click',()=>setTab(button.dataset.tab));
button.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','Home','End'].includes(e.key)){e.preventDefault();setTab(e.key==='Home'?'plan':e.key==='End'?'mockup':active==='plan'?'mockup':'plan',true);}});
});
window.addEventListener('hashchange',()=>setTab(location.hash.slice(1)));
setTab(location.hash.slice(1)||'plan');
</script>
